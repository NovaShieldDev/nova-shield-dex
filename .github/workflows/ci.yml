name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ── Rust ────────────────────────────────────────────────────────────────────
  rust:
    name: Rust (test + clippy + fmt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain kur
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Bağımlılıkları önbelleğe al
        uses: Swatinem/rust-cache@v2

      - name: Format kontrolü
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Testler
        run: cargo test --workspace

  # ── Next.js ────────────────────────────────────────────────────────────────
  web:
    name: Web (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Bağımlılıkları yükle
        run: npm ci

      - name: TypeScript kontrolü
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build

  # ── Docker ─────────────────────────────────────────────────────────────────
  docker:
    name: Docker image build testi
    runs-on: ubuntu-latest
    needs: [rust, web]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Docker Buildx kur
        uses: docker/setup-buildx-action@v3

      - name: nova-dex-server image oluştur
        uses: docker/build-push-action@v6
        with:
          context: .
          file: crates/nova-dex-server/Dockerfile
          push: false
          tags: nova-dex-server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: nova-dex-web image oluştur
        uses: docker/build-push-action@v6
        with:
          context: apps/web
          file: apps/web/Dockerfile
          push: false
          tags: nova-dex-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
