worker_processes      auto;
worker_rlimit_nofile  65535;

events {
    worker_connections  4096;
    multi_accept        on;
    use                 epoll;
}

http {
    # ── Temel Ayarlar ──────────────────────────────────────────────────────────
    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    keepalive_requests  1000;
    server_tokens       off;

    # ── Upstream: Nova DEX API Sunucuları ─────────────────────────────────────
    # Docker Compose --scale nova-dex-server=N ile N kopya otomatik algılanır.
    # least_conn: en az aktif bağlantıya sahip sunucuya yönlendirir.
    upstream nova_dex_api {
        least_conn;
        server nova-dex-server:3000;
        keepalive 64;          # upstream keepalive havuzu
    }

    # ── Rate Limiting ─────────────────────────────────────────────────────────
    # Genel API: IP başına saniyede 100 istek
    limit_req_zone  $binary_remote_addr  zone=api_general:10m   rate=100r/s;
    # Commit endpoint: IP başına saniyede 20 istek (MEV spam koruması)
    limit_req_zone  $binary_remote_addr  zone=api_commit:10m    rate=20r/s;
    # Reveal endpoint: IP başına saniyede 20 istek
    limit_req_zone  $binary_remote_addr  zone=api_reveal:10m    rate=20r/s;

    # ── Gzip Sıkıştırma ───────────────────────────────────────────────────────
    gzip              on;
    gzip_min_length   256;
    gzip_comp_level   4;
    gzip_types        application/json text/plain;
    gzip_vary         on;

    # ── Güvenlik Header'ları ──────────────────────────────────────────────────
    add_header X-Content-Type-Options  nosniff              always;
    add_header X-Frame-Options         DENY                 always;
    add_header X-XSS-Protection        "1; mode=block"      always;
    add_header Referrer-Policy         strict-origin        always;

    # ── Proxy Zaman Aşımları ──────────────────────────────────────────────────
    proxy_connect_timeout   5s;
    proxy_send_timeout      30s;
    proxy_read_timeout      30s;
    proxy_http_version      1.1;
    proxy_set_header        Connection     "";       # keepalive için boş bırak
    proxy_set_header        Host           $host;
    proxy_set_header        X-Real-IP      $remote_addr;
    proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header        X-Forwarded-Proto $scheme;

    # ── Sunucu: Nova DEX API ──────────────────────────────────────────────────
    server {
        listen       80;
        server_name  _;

        # Sağlık kontrolü — rate limit yok
        location = /health {
            proxy_pass         http://nova_dex_api;
            access_log         off;
        }

        # MEV commit — sıkı rate limit
        location = /v1/mev/commit {
            limit_req  zone=api_commit  burst=40  nodelay;
            proxy_pass http://nova_dex_api;
        }

        # MEV reveal — sıkı rate limit
        location = /v1/mev/reveal {
            limit_req  zone=api_reveal  burst=40  nodelay;
            proxy_pass http://nova_dex_api;
        }

        # Genel API
        location /v1/ {
            limit_req  zone=api_general  burst=200  nodelay;
            proxy_pass http://nova_dex_api;
        }

        # Diğer — 404
        location / {
            return 404;
        }
    }
}
