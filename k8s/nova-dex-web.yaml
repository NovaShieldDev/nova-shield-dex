---
# ── Nova DEX Web Arayüzü Deployment ──────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nova-dex-web
  namespace: nova-dex
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nova-dex-web
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: nova-dex-web
    spec:
      containers:
        - name: nova-dex-web
          image: nova-dex-web:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3001
          env:
            - name: PORT
              value: "3001"
            - name: NEXT_PUBLIC_DEX_API
              value: "https://api.novashieldchain.com"
          readinessProbe:
            httpGet:
              path: /
              port: 3001
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3001
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"

---
# ── Nova DEX Web Service ──────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: nova-dex-web
  namespace: nova-dex
spec:
  selector:
    app: nova-dex-web
  ports:
    - port: 3001
      targetPort: 3001

---
# ── Web Ingress ───────────────────────────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nova-dex-web-ingress
  namespace: nova-dex
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - dex.novashieldchain.com
      secretName: nova-dex-web-tls
  rules:
    - host: dex.novashieldchain.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nova-dex-web
                port:
                  number: 3001
